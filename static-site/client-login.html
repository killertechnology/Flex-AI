<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Client Portal | Flex-AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="portal-page">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Flex-AI home">
        <span class="brand-mark">F</span>
        <span>Flex-AI</span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="index.html#services">Services</a>
        <a href="index.html#work">Work</a>
        <a href="index.html#method">Method</a>
        <a href="index.html#contact">Contact</a>
      </nav>
      <a class="header-cta" href="client-login.html">Client Login</a>
    </header>

    <main class="login-shell">
      <section class="login-panel">
        <p class="eyebrow">Client portal</p>
        <h1>Private concept review.</h1>
        <p class="hero-lede">Sign in to view protected creative directions and stakeholder notes.</p>
        <form class="login-form" data-login-form>
          <label>
            Username
            <input type="text" name="username" autocomplete="username" placeholder="client" />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" placeholder="Password" />
          </label>
          <p class="login-error" data-login-error hidden>That username or password does not match.</p>
          <button type="submit">Sign in</button>
        </form>
      </section>
    </main>

    <script src="client-auth.js"></script>
  </body>
</html>
